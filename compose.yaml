name: streamos

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: streamos
      POSTGRES_PASSWORD: streamos
      POSTGRES_USER: streamos
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U streamos -d streamos']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  xtts:
    image: daswer123/xtts-api-server:latest
    ports:
      - '8020:8020'
    volumes:
      - ./apps/api/voices/speakers:/app/speakers
      - ./apps/api/.runtime/xtts-output:/app/output
      - ./apps/api/.runtime/xtts-models:/app/xtts_models
    environment:
      - COQUI_TOS_AGREED=1
    command:
      - python3
      - -m
      - xtts_api_server
      - -hs
      - 0.0.0.0
      - -p
      - '8020'
      - -d
      - cpu
      - -sf
      - /app/speakers
      - -o
      - /app/output
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
